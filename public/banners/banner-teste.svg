<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 384" width="1920" height="384">
  <title>Banner I.J Print — 1920 × 384 px — proporção 5:1</title>
  <desc>Guia de banner com área segura nos 60% centrais e relevos diagonais nas laterais decorativas de 20%.</desc>
  <defs>
    <pattern id="ridges" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="32" height="32" fill="#18181b"/>
      <path d="M4 0V32" stroke="#09090b" stroke-width="9"/>
      <path d="M10 0V32" stroke="#3f3f46" stroke-width="2"/>
      <path d="M13 0V32" stroke="#27272a" stroke-width="5"/>
    </pattern>
    <linearGradient id="edge" x2="1" y2="0">
      <stop stop-color="#09090b" stop-opacity="0"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <g id="surface">
      <path d="M0 0H320L370 96L310 192L370 288L320 384H0Z" fill="url(#ridges)"/>
      <path d="M270 0L326 96L266 192L326 288L270 384" fill="none" stroke="#52525b" stroke-opacity=".3" stroke-width="2"/>
      <path d="M288 0L344 96L284 192L344 288L288 384" fill="none" stroke="#09090b" stroke-width="6"/>
      <rect width="384" height="384" fill="url(#edge)"/>
    </g>
  </defs>
  <rect width="1920" height="384" fill="#09090b"/>
  <use href="#surface"/>
  <use href="#surface" transform="translate(1920 384) rotate(180)"/>
  <rect x="384" y="32" width="1152" height="320" rx="12" fill="none" stroke="#D4C3A3" stroke-opacity=".3" stroke-dasharray="8 10"/>
  <path d="M384 64V32H416 M1504 32H1536V64 M384 320V352H416 M1504 352H1536V320" fill="none" stroke="#D4C3A3" stroke-width="2"/>
