    <text x="960" y="96" fill="#a1a1aa" font-size="24" letter-spacing="5">ÁREA SEGURA · 60% CENTRAL</text>
    <text x="960" y="168" fill="#e4e4e7" font-size="52" font-weight="700" letter-spacing="3">BANNER I.J PRINT</text>
    <text x="960" y="236" fill="#D4C3A3" font-size="48" font-weight="700">1920 × 384 px</text>
    <text x="960" y="296" fill="#d4d4d8" font-size="32" letter-spacing="4">PROPORÇÃO 5:1</text>
